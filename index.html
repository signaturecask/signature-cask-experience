<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Cask | Digital Provenance Ledger</title>
    <style>
        :root {
            --gold: #dfb76c;
            --dark-gold: #aa8445;
            --black: #0a0a0a;
            --grey: #161616;
            --light-grey: #8a8a8a;
            --border-glow: rgba(223, 183, 108, 0.2);
        }

        body {
            background-color: var(--black);
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #1c1c1c 0%, #050505 100%);
        }

        .ledger-card {
            max-width: 480px;
            width: 90%;
            background: linear-gradient(145deg, #121212 0%, #0d0d0d 100%);
            border: 1px solid var(--dark-gold);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 30px var(--border-glow);
            box-sizing: border-box;
        }

        .brand-header {
            margin-bottom: 35px;
        }

        .title {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 8px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .tagline {
            font-size: 11px;
            color: var(--light-grey);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .input-wrapper {
            position: relative;
            max-width: 200px;
            margin: 0 auto;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #000000;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 18px;
            text-align: center;
            letter-spacing: 2px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(223, 183, 108, 0.3);
        }

        input::-webkit-inner-spin-button, 
        input::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .action-btn {
            background: linear-gradient(135deg, var(--gold) 0%, var(--dark-gold) 100%);
            color: #000000;
            border: none;
            padding: 16px 35px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .action-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .display-panel {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #222;
            display: none;
            text-align: left;
            animation: slideUp 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(223, 183, 108, 0.08);
            color: var(--gold);
            padding: 6px 14px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            margin-bottom: 20px;
            border: 1px solid rgba(223, 183, 108, 0.25);
            gap: 8px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 13px;
        }

        .data-row:last-of-type {
            border-bottom: none;
        }

        .data-label {
            color: var(--light-grey);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .data-value {
            color: #ffffff;
        }

        .gold-text {
            color: var(--gold);
            font-weight: 600;
        }

        .audio-status {
            margin-top: 25px;
            font-size: 11px;
            color: var(--gold);
            letter-spacing: 1px;
            text-align: center;
            opacity: 0.8;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--gold);
            border-radius: 50%;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="ledger-card">
        <div class="brand-header">
            <h1 class="title">Signature Cask</h1>
            <p class="tagline">The Experience Ledger</p>
        </div>

        <div class="input-section">
            <label for="bottleInput">Enter Custodian Bottle Number</label>
            <div class="input-wrapper">
                <input type="number" id="bottleInput" min="1" max="89" placeholder="01" autocomplete="off">
            </div>
            <button class="action-btn" onclick="checkProvenance()">Verify Provenance</button>
        </div>

        <div id="displayPanel" class="display-panel">
            <div class="verified-badge">
                <span class="pulse-dot"></span> Provenance Authenticated
            </div>
            
            <div class="data-row">
                <span class="data-label">Asset Identity</span>
                <span class="data-value">Inchgower 16-Year Single Cask</span>
            </div>
            <div class="data-row">
                <span class="data-label">Cask Reference</span>
                <span class="data-value">#
